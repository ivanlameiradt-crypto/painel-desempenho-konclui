name: Atualizar Painel de Desempenho (Koncluí)

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC = 04:00 Brasília — madrugada, dia anterior já fechado
  workflow_dispatch:       # permite rodar manualmente para testar

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configurar/ligar o GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Gerar painel (login + leitura do Koncluí)
        env:
          KONCLUI_EMAIL: ${{ secrets.KONCLUI_EMAIL }}
          KONCLUI_SENHA: ${{ secrets.KONCLUI_SENHA }}
        run: python gerar_painel.py
      - name: Guardar debug (texto + print) para diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 7
      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
